name: pull-request-quality-gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      SESSION_COOKIE_SECURE: "false"
      DATABASE_MIGRATION_URL: postgresql://tapra2_owner:ci_owner_only@127.0.0.1:5432/tapra2_test
      DATABASE_URL: postgresql://tapra2_app:ci_app_only@127.0.0.1:5432/tapra2_test
      TEST_DATABASE_MIGRATION_URL: postgresql://tapra2_owner:ci_owner_only@127.0.0.1:5432/tapra2_test
      TEST_DATABASE_URL: postgresql://tapra2_app:ci_app_only@127.0.0.1:5432/tapra2_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create isolated PostgreSQL roles and database
        env:
          PGPASSWORD: ci_admin_only
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tapra2_owner LOGIN PASSWORD 'ci_owner_only';
          CREATE ROLE tapra2_app LOGIN PASSWORD 'ci_app_only';
          CREATE DATABASE tapra2_test OWNER tapra2_owner;
          GRANT CONNECT ON DATABASE tapra2_test TO tapra2_app;
          SQL

      - name: Typecheck frontend
        run: npm run typecheck:web

      - name: Typecheck backend
        run: npm run typecheck:server

      - name: Run configured lint gate
        run: npm run lint

      - name: Build frontend and backend
        run: npm run build

      - name: Run PostgreSQL-backed tests and fresh migrations
        run: npm test

      - name: Verify migrations are repeatable
        run: npm run db:migrate
